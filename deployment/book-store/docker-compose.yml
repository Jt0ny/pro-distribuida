services:
  dbserver:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: books-db
    volumes:
      - "c:/db-distribuida:/var/lib/postgresql/data"
    ports:
      - 54321:5432

  consul:
    image: consul:1.15.4
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    expose:
      - 8500
    ports:
      - 8500:8500
  proxy:
    image: traefik:3.6.6
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.consulCatalog
      - --providers.consulCatalog.refreshInterval=5s
      - --providers.consulCatalog.exposedByDefault=false
      - --providers.consulCatalog.endpoint.address=consul:8500
    ports:
      - 8888:8080
      - 8080:80
    depends_on:
      - consul


  authors:
    image: anthonyjoel/app-authors
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: 1234
      QUARKUS_HTTP_PORT: 8070
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      QUARKUS_FLYWAY_ACTIVE: "true"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
      QUARKUS_FLYWAY_BASELINE_ON_MIGRATE: "true"
      QUARKUS_FLYWAY_BASELINE_VERSION: "1.0.1"
    expose:
      - 8070
    deploy:
      replicas: 1
    depends_on:
      - dbserver

  books:
    image:  anthonyjoel/app-books
    environment:
      QUARKUS_APPLICATION_NAME: app-books
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: 1234
      QUARKUS_HTTP_PORT: 8070
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      QUARKUS_FLYWAY_ACTIVE: "true"
      QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.books.rule=PathPrefix(`/app-books`)"
      - "traefik.http.services.books.loadbalancer.server.port=8070"
    expose:
      - 8070
    deploy:
      replicas: 1

    depends_on:
      - dbserver
      - authors

  app-web-react:
    build:
      context: ../../app-web-react
      dockerfile: docker/Dockerfile
      args:
        VITE_BOOKS_API_URL: http://proxy:8080/app-books/books
    image: anthonyjoel/app-web-react
    ports:
      - 3000:3000
    depends_on:
      - books


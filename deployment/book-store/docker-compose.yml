  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./configs:/etc/prometheus
    ports:
      - "9090:9090"
    expose:
      - 9090

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    expose:
      - 3000
  #    depends_on:
  #      - prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_URI: "dbserver:5432/books-db?sslmode=disable"
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASSWORD: 1234
    ports:
      - 9187

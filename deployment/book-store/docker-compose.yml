services:
  dbserver:
    image: postgres:17.7-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: books-db
    volumes:
      - "c:/db-distribuida:/var/lib/postgresql/data"
    ports:
      - 54321:5432

  consul:
    image: consul:1.15.4
    command: |
      agent -dev
      -ui
      -bind 0.0.0.0
      -client 0.0.0.0
    expose:
      - 8500
    ports:
      - 8500:8500
  proxy:
    image: traefik:3.6.6
    command:
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.consulCatalog
      - --providers.consulCatalog.refreshInterval=5s
      - --providers.consulCatalog.exposedByDefault=false
      - --providers.consulCatalog.endpoint.address=consul:8500
    ports:
      - 8888:8080
      - 8080:80
    depends_on:
      - consul


  authors:
    image: anthonyjoel/app-authors
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: 1234
      QUARKUS_HTTP_PORT: 8070
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    expose:
      - 8070
   # ports:
    #  - 8888:8070
    deploy:
      replicas: 1

    depends_on:
      - dbserver

  books:
    image:  anthonyjoel/app-books
    environment:
      QUARKUS_APPLICATION_NAME: app-books
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://dbserver:5432/books-db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: 1234
      QUARKUS_HTTP_PORT: 8070
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
    expose:
      - 8070
   # ports:
    #  - 8889:8070
    deploy:
      replicas: 1

    depends_on:
      - dbserver
      - authors
